apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kinetia
  namespace: kinetia
spec:
  rules:
    - host: kinetia.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kinetia
                port:
                  number: 80
